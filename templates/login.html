<!DOCTYPE html>
<html>
<head>
    <title>AIProxy — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Outfit', sans-serif; background-color: #0f172a; color: #f8fafc; height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: #1e293b; border: 1px solid #334155; border-radius: 24px; padding: 2.5rem; width: 100%; max-width: 450px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04); }
        .form-control { background-color: #0f172a; border: 1px solid #334155; color: #f8fafc; border-radius: 12px; padding: 0.75rem 1rem; }
        .form-control:focus { background-color: #0f172a; border-color: #3b82f6; color: #f8fafc; box-shadow: 0 0 0 2px rgba(59, 130, 246, 0.25); }
        .btn-primary { background: linear-gradient(135deg, #3b82f6, #2563eb); border: none; border-radius: 12px; padding: 0.75rem; font-weight: 600; }
        .btn-outline-secondary { border: 1px solid #334155; color: #94a3b8; border-radius: 12px; padding: 0.75rem; font-weight: 600; }
        .btn-outline-secondary:hover { background-color: #334155; color: #f8fafc; }
        .alert { border-radius: 12px; }
        .logo { font-size: 2rem; font-weight: 600; margin-bottom: 2rem; text-align: center; background: linear-gradient(135deg, #60a5fa, #3b82f6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">⚡ AIProxy</div>
        <h4 class="text-center mb-4">Welcome Back</h4>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} small">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" id="loginForm">
            <input type="hidden" name="login_type" id="login_type" value="user">
            <div class="mb-3">
                <label class="form-label text-muted small">Username</label>
                <input type="text" name="username" class="form-control" placeholder="Enter your username" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-muted small">Password</label>
                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
            </div>
            
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary" onclick="setLoginType('user')">User Login</button>
                <button type="submit" class="btn btn-outline-secondary" onclick="setLoginType('admin')">Admin Login</button>
            </div>
        </form>
    </div>

    <script>
        function setLoginType(type) {
            document.getElementById('login_type').value = type;
        }
    </script>
</body>
</html>
