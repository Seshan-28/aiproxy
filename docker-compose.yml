version: '3.8'

services:
  aiproxy:
    build: .
    container_name: aiproxy
    ports:
      - "5000:5000"
    volumes:
      - ./data:/data
    env_file:
      - .env
    restart: always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/"]
      interval: 30s
      timeout: 10s
      retries: 3
